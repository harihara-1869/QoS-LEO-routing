services:
  mission-control:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${LEO_DASHBOARD_PORT:-8080}:8000"
    volumes:
      - "${LEO_RUNS_DIR:-./runs}:/workspace/runs"
    environment:
      LEO_DASHBOARD_DATA: /workspace/runs/dashboard
    init: true
    stop_grace_period: 15s
